# A local stand-in for the production deployment: one relay behind nginx.
#
# The relay keeps its sessions in memory, so there is exactly one of them. See
# ../../README.md before adding a second.
services:
  load-balancer:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Override with SENDFILE_PORT when 8080 is taken.
      - "${SENDFILE_PORT:-8080}:8080"
    depends_on:
      - relay

  relay:
    build:
      context: ../../../api-server
    environment:
      SENDFILE_LISTEN: 0.0.0.0:8080
      RUST_LOG: debug
    restart: unless-stopped
