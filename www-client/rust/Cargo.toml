[package]
name = "sendfile-www-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = { version = "0.2.0", features = ["color"] }
log = "0.4.14"
sendfile = { path = "../../rust-client/sendfile" }
wasm-bindgen = "0.2.79"

# enable the js feature in getrandom (see https://docs.rs/getrandom/latest/getrandom/#webassembly-support).
getrandom = { version = "0.2", features = ["js"] }
