[package]
name    = "sendfile-ios-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "sendfile_ios_rust"
crate_type = ["staticlib"]

[dependencies]
log = "0.4.14"
sendfile = { git = "ssh://git@github.com/privacyresearchgroup/sendfile-cli.git", branch = "master", features = ["ffi"] }
uniffi = "0.18.0"

[build-dependencies]
sendfile-ffi-bindings = { git = "ssh://git@github.com/privacyresearchgroup/sendfile-cli.git", branch = "master" }
uniffi_build = { version = "0.18.0", features = ["builtin-bindgen"] }
uniffi_bindgen = "0.18.0"
