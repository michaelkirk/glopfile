[package]
name    = "sendfile-ios-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "sendfile_ios_rust"
crate_type = ["staticlib"]

[dependencies]
log = "0.4.14"
sendfile = { path = "../../rust-client/sendfile", features = ["ffi"] }
uniffi = "0.18.0"

[build-dependencies]
sendfile-ffi-bindings = { path = "../../rust-client/sendfile-ffi-bindings" }
uniffi_build = { version = "0.18.0", features = ["builtin-bindgen"] }
uniffi_bindgen = "0.18.0"
