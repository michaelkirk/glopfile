user nginx;

events {
  worker_connections 1000;
}

http {
  # required to proxy websockets
  # based on https://www.nginx.com/blog/websocket-nginx/
  map $http_upgrade $connection_upgrade {
    default Upgrade;
    ''      close;
  }

  upstream relay {
    server relay:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://relay;

      # The relay streams an upload straight through to the downloader, so
      # neither direction may be buffered here: with buffering on, nginx holds
      # the whole upload before contacting the relay and the download stalls
      # until the upload has finished.
      proxy_request_buffering off;
      proxy_buffering off;

      # An uploader waits on this connection until a downloader appears.
      proxy_read_timeout 10d;
      proxy_send_timeout 10d;

      # required to proxy websockets
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
