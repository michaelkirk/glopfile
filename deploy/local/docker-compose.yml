# The relay, built from this checkout.
services:
  relay:
    build:
      context: ../../glopfile-relay
    ports:
      - "127.0.0.1:${GLOPFILE_PORT:-8080}:8080"
    command: ["--address", "0.0.0.0", "--port", "8080"]
    environment:
      RUST_LOG: ${RUST_LOG:-glopfile=debug,info}
    restart: unless-stopped
