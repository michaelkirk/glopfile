# Production deployment: one relay behind nginx.
#
# The image is the one built from api-server/Dockerfile and pushed by
# .github/workflows/docker-image.yml; there is no separate deploy image,
# because the relay is configured entirely through the environment.
services:
  load-balancer:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    depends_on:
      - relay
    restart: unless-stopped
    logging: &papertrail
      driver: syslog
      options:
        syslog-address: "tcp+tls://logs.papertrailapp.com:47008"
        syslog-format: rfc5424
        tag: "{{.Name}}"

  relay:
    image: ${SENDFILE_IMAGE:-ghcr.io/privacyresearchgroup/sendfile:latest}
    environment:
      SENDFILE_LISTEN: 0.0.0.0:8080
      RUST_LOG: info
    restart: unless-stopped
    logging: *papertrail
