# Production deployment: one relay behind nginx.
#
# The image is the one built from api-server/Dockerfile and pushed by
# .github/workflows/api-server.yml; there is no separate deploy image,
# because the relay is configured entirely through the environment.
#
# Both containers just print to stdout and let the host collect it; drop the
# logging blocks to fall back to whatever the docker daemon defaults to.
services:
  load-balancer:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    depends_on:
      - relay
    restart: unless-stopped
    logging: &journal
      driver: journald

  relay:
    image: ${SENDFILE_IMAGE:-ghcr.io/privacyresearchgroup/sendfile:latest}
    environment:
      SENDFILE_LISTEN: 0.0.0.0:8080
      RUST_LOG: info
    restart: unless-stopped
    logging: *journal
