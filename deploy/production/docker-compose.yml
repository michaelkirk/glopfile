# The relay, bound to a private port for an nginx that lives outside this repo.
#
# The image is the one built from glopfile-relay/Dockerfile by
# .github/workflows/docker-image.yml. There is no deployment-specific image: the
# relay takes its configuration as arguments, and RUST_LOG from the environment.
services:
  relay:
    image: ${GLOPFILE_IMAGE:-ghcr.io/michaelkirk/glopfile:latest}
    # Loopback only. Nothing reaches the relay except the reverse proxy on this
    # host; publishing on 0.0.0.0 would expose it directly.
    ports:
      - "127.0.0.1:${GLOPFILE_PORT:-8080}:8080"
    command: ["--address", "0.0.0.0", "--port", "8080"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    # Print to stdout and let the host's journal keep it.
    logging:
      driver: journald
