[workspace]
members = [
    "api-server",
    "rust-client/cli",
    "rust-client/macros",
    "rust-client/sendfile",
    "rust-client/sendfile-ffi-bindings",
]
# ios-client and www-client build bundles of their own, against their own pinned
# toolchains. .worktrees holds git worktrees of this repo, whose packages belong
# to their own checkout's workspace, not this one.
exclude = [".worktrees", "ios-client", "www-client"]
resolver = "2"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
backon = "1.6.0"
base64 = "0.23.1"
bytes = "1.12.1"
camino = "1.2.6"
cfg-if = "1.0.5"
clap = "4.6.7"
crossbeam = "0.8.5"
crossbeam-utils = "0.8.23"
datachannel = "0.16.1"
derive_more = { version = "2.1.1", features = ["deref", "from"] }
futures = "0.3.34"
getrandom = "0.4"
gloo-timers = "0.4.0"
hkdf = "0.13.0"
http = "1.5.0"
indicatif = "0.18.6"
js-sys = "0.3.105"
log = "0.4.34"
num_enum = "0.7.6"
pin-project = "1.1.13"
pretty_env_logger = "0.5.0"
proc-macro2 = { version = "1.0.107", default-features = false }
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
quote = "1.0.47"
rand = "0.10.2"
reqwest = "0.13.5"
scopeguard = "1.2.0"
sendfile = { path = "rust-client/sendfile" }
sendfile-macros = { path = "rust-client/macros" }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = "3.0.6"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-stream = "0.1"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tungstenite = "0.30.0"
uniffi = "0.32.1"
uniffi_bindgen = "0.32.1"
uniffi_build = "0.32.1"
url = "2.5.8"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = "0.3.105"
web-time = "1.1.0"
webrtc-sdp = "0.3.15"
zeroize = "1.9"

# Only use the strip option for sendfile-cli, since it is only stable since Cargo 1.59.0, and Cargo before that will
# then fail to compile _any_ of our workspace packages with any profile if we specify it globally.
[profile.distribution.package.sendfile-cli]
strip = true

[profile.distribution]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true
