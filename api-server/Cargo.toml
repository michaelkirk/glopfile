[package]
name = "sendfile-relay"
version = "0.1.0"
edition = "2021"
description = "Sendfile relay"

# The crate is named for the workspace, where rust-client already owns the name
# "sendfile"; the binary keeps the name the deployment expects.
[[bin]]
name = "sendfile"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
prost.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["form", "json", "stream"] }
tokio-tungstenite.workspace = true
