[package]
name = "sendfile-relay"
version = "0.1.0"
edition = "2021"
description = "Sendfile relay"

# The crate is named for the workspace, where rust-client already owns the name
# "sendfile"; the binary keeps the name the deployment expects.
[[bin]]
name = "sendfile"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
prost = "0.14.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.9.1"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["form", "json", "stream"] }
tokio-tungstenite = "0.30.0"
