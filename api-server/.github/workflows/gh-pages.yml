name: gh-pages
on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash
jobs:
  gh-pages:
    name:    gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: rebar3 edoc
        run:  rebar3 edoc

      - name: force push docs to gh-pages branch
        run: |
          git config user.name "Github CI -- gh-pages"
          git config user.email "<>"
          git add -f apps/sendfile/doc
          git commit -m "render edocs"
          git push -f origin HEAD:gh-pages
