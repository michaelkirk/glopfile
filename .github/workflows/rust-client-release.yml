name: rust-client release

on:
  push:
    tags:
      - 'rust-client-[0-9]+.[0-9]+.[0-9]+'
      - 'rust-client-[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  package_name: glopfile-cli

# gh release create/upload writes to the repo.
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: generate Acknowledgements.md
        run: |
          cargo about generate \
            --manifest-path rust-client/cli/Cargo.toml \
            --config rust-client/about.toml \
            rust-client/Acknowledgements.md.hbs \
            -o rust-client/Acknowledgements.md

      - name: set package_version
        run: echo "package_version=$(cargo pkgid --package $package_name | sed 's/.*[#@]//')" >> "$GITHUB_ENV"

      - name: the tag and the crate agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="rust-client-$package_version"
          case "$GITHUB_REF_NAME" in
            "$expected" | "$expected"-*) ;;
            *)
              echo "tag $GITHUB_REF_NAME is neither $expected nor a suffix of it" >&2
              exit 1
              ;;
          esac

      - name: cargo build --profile distribution
        env:
          GLOPFILE_API_ENDPOINT: ${{ secrets.GLOPFILE_API_ENDPOINT }}
          GLOPFILE_DOWNLOAD_ENDPOINT: ${{ secrets.GLOPFILE_DOWNLOAD_ENDPOINT }}
        run: cargo build --profile distribution --target=${{ matrix.target }} -p $package_name

      - name: assemble archive
        run: |
          archive_name="$package_name-$package_version-${{ matrix.platform }}"
          mkdir -p "$archive_name/"
          cp rust-client/README.md rust-client/Acknowledgements.md "$archive_name/"
          cp "target/${{ matrix.target }}/distribution/$package_name" "$archive_name/"
          tar -czf "$archive_name.tar.gz" "$archive_name/"
          echo "archive_filename=$archive_name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_filename }}
          path: ${{ env.archive_filename }}

      - name: upload release archive
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            rust-client-"$package_version") prerelease= ;;
            *) prerelease=--prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $prerelease || true
          gh release upload --clobber "$GITHUB_REF_NAME" "$archive_filename"
