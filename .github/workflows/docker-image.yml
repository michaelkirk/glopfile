name: docker-image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds in every pull request so a broken Dockerfile is caught in
      # review; only main is published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: glopfile-relay/Dockerfile
          load: ${{ github.ref != 'refs/heads/main' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/glopfile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image serves the api
        if: github.ref != 'refs/heads/main'
        run: |
          docker run -d --name relay -p 127.0.0.1:8080:8080 \
            ghcr.io/${{ github.repository_owner }}/glopfile:latest
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health_check | grep -q '"ok"'; then
              docker rm -f relay
              exit 0
            fi
            sleep 1
          done
          docker logs relay
          docker rm -f relay
          exit 1
