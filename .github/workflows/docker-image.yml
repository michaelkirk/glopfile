name: docker-image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds in every pull request so a broken Dockerfile is caught in
      # review; only main is published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: glopfile-relay/Dockerfile
          load: ${{ github.ref != 'refs/heads/main' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/glopfile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image serves the api
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository_owner }}/glopfile:latest

          serves() {
            local name=$1 published=$2 inside=$3
            shift 3
            docker run -d --name "$name" -p "127.0.0.1:$published:$inside" "$image" "$@" > /dev/null
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$published/api/v1/health_check" | grep -q '"ok"'; then
                docker rm -f "$name" > /dev/null
                return 0
              fi
              sleep 1
            done
            echo "$name never answered its health check" >&2
            docker logs "$name" >&2
            docker rm -f "$name" > /dev/null
            return 1
          }

          serves relay-default 8080 8080
          serves relay-arguments 8099 8099 --address 0.0.0.0 --port 8099
