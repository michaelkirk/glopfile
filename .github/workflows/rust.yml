name: rust

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p glopfile --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - run: cargo clippy -p glopfile --features ffi --all-targets -- -D warnings

      # The client's round-trip tests talk to a relay on :8080, the default
      # baked in when TEST_GLOPFILE_API_ENDPOINT is unset. Now that both live
      # in this repo we can give them a real one rather than let them fail.
      - name: start the relay
        run: |
          cargo build -p glopfile-relay --bin glopfile-relay
          ./target/debug/glopfile-relay --address 127.0.0.1 --port 8080 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/health_check >/dev/null && exit 0
            sleep 1
          done
          echo "relay did not come up" >&2
          exit 1

      - run: cargo test --workspace
