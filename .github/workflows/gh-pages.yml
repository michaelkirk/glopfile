name: gh-pages

on:
  push:
    branches:
      - main
      - gh-pages-source
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The docs are published by force-pushing a branch.
permissions:
  contents: write

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - run: mkdir -p docs/native docs/web

      # glopfile and glopfile-ffi-bindings are the published client API. The
      # relay, the CLI and the macro crate are not what these docs are for.
      - name: render native docs
        run: |
          cargo doc --lib --workspace --no-deps \
            --exclude glopfile-macros --exclude glopfile-cli --exclude glopfile-relay
          mv target/doc/ docs/native/public/
          cargo doc --lib --workspace --no-deps --document-private-items
          mv target/doc/ docs/native/private/

      # getrandom needs to be told which wasm backend to use, or it refuses to
      # build for wasm32-unknown-unknown at all.
      - name: render web docs
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: |
          cargo doc --lib --workspace --no-deps --target wasm32-unknown-unknown \
            --exclude glopfile-macros --exclude glopfile-cli --exclude glopfile-relay
          mv target/wasm32-unknown-unknown/doc/ docs/web/public/
          cargo doc --lib --workspace --no-deps --document-private-items --target wasm32-unknown-unknown
          mv target/wasm32-unknown-unknown/doc/ docs/web/private/

      - name: push docs to gh-pages
        run: |
          git config user.name "Github CI -- gh-pages"
          git config user.email "<>"
          git add docs
          git commit -m "render rustdocs"
          git push -f origin HEAD:gh-pages
