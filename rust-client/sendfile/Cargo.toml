[package]
name = "sendfile"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["static"]
static = ["datachannel/static"]

[dependencies]
aes-gcm = "0.9.4"
async-trait = "0.1.52"
base64 = "0.13.0"
bytes = "1.1.0"
cfg-if = "1.0.0"
derive_more = "0.99.17"
futures = "0.3.21"
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
log = "0.4.14"
pin-project = "1.0.10"
prost = "0.9.0"
rand = "0.8.4"
reqwest = { git = "https://github.com/privacyresearchgroup/reqwest.git", branch = "wasm-streaming", features = ["json", "stream"] }
serde = { version = "*", features = ["derive"] }
serde_json = "1.0.75"
thiserror = "1.0.30"
url = "2.2.2"
wasm-bindgen = "0.2.79"
webrtc-sdp = "0.3.9"
zeroize = { version = "1.5", features = ["derive"] }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
datachannel = "0.7.3"
tokio = { version = "1.16.1", features = ["fs", "macros"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.16.1", features = ["native-tls"] }
tokio-util = { version = "0.7.0" , features = ["compat"] }
tungstenite = "0.16.0"

[target."cfg(target_arch = \"wasm32\")".dependencies]
js-sys = "0.3.56"
gloo-timers = { version = "0.2.4", features = ["futures"] }
sendfile-macros = { path = "../macros" }
wasm-bindgen-futures = "0.4.29"
web-sys = { version = "0.3.56", features = [
  "AesGcmParams",
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "CryptoKey",
  "ErrorEvent",
  "MessageEvent",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcIceConnectionState",
  "RtcIceGatheringState",
  "RtcIceServer",
  "RtcPeerConnection",
  "RtcPeerConnectionIceEvent",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSignalingState",
  "SubtleCrypto",
  "Url",
  "WebSocket",
  "Window",
] }


[dev-dependencies]
pretty_env_logger = "0.4.0"
tempfile = "3.3.0"

[target."cfg(target_arch = \"wasm32\")".dev-dependencies]
# enable the js feature in getrandom (see https://docs.rs/getrandom/latest/getrandom/#webassembly-support).
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
prost-build = "0.9.0"
