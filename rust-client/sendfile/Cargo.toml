[package]
name = "sendfile"
version = "0.1.0"

# We use edition 2018 to support rustc 1.55.0
edition = "2018"

# We may or may not compile on rustc before this version, but this is the earliest version we test on. We want to
# support 1.55.0 specifically because it's the last version which current Apple XCode (as of writing) supports building
# App Store releases with, which is documented here: https://github.com/rust-lang/rust/issues/83106
rust-version = "1.55.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes-gcm = "0.9.4"
base64 = "0.13.0"
log = "0.4.14"
rand = "0.8.4"
reqwest = { version = "0.11.9", features = ["blocking", "json"] }
serde = { version = "*", features = ["derive"] }
serde_json = "1.0.75"
thiserror = "1.0.30"
url = "2.2.2"
zeroize = { version = "1.5", features = ["derive"] }

[dev-dependencies]
pretty_env_logger = "0.4.0"
