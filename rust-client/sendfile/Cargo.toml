[package]
name = "sendfile"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["static"]
static = ["datachannel/static"]
ffi = ["uniffi", "uniffi_build"]

[dependencies]
aes-gcm.workspace = true
async-trait.workspace = true
base64.workspace = true
backoff = { workspace = true, features = ["futures"] }
bytes.workspace = true
cfg-if.workspace = true
crossbeam-utils.workspace = true
derive_more.workspace = true
futures.workspace = true
http.workspace = true
instant = { workspace = true, features = ["wasm-bindgen"] }
log.workspace = true
num_enum.workspace = true
pin-project.workspace = true
prost.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
scopeguard.workspace = true
thiserror.workspace = true
uniffi = { workspace = true, optional = true }
url.workspace = true
wasm-bindgen.workspace = true
webrtc-sdp.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
datachannel.workspace = true
hkdf.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "macros"] }
tokio-stream.workspace = true
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
tokio-util = { workspace = true, features = ["compat"] }
tungstenite.workspace = true

[target."cfg(target_arch = \"wasm32\")".dependencies]
js-sys.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
sendfile-macros.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "AesGcmParams",
  "AesKeyGenParams",
  "BinaryType",
  "CloseEvent",
  "Crypto",
  "CryptoKey",
  "ErrorEvent",
  "HkdfParams",
  "MessageEvent",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelInit",
  "RtcDataChannelType",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcIceConnectionState",
  "RtcIceGatheringState",
  "RtcIceServer",
  "RtcPeerConnection",
  "RtcPeerConnectionIceEvent",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
  "RtcSignalingState",
  "SubtleCrypto",
  "Url",
  "WebSocket",
  "Window",
] }


[dev-dependencies]
pretty_env_logger.workspace = true
tempfile.workspace = true

[target."cfg(target_arch = \"wasm32\")".dev-dependencies]
# enable the js feature in getrandom (see https://docs.rs/getrandom/latest/getrandom/#webassembly-support).
getrandom = { workspace = true, features = ["js"] }

[build-dependencies]
prost-build.workspace = true
uniffi_build = { workspace = true, features = ["builtin-bindgen"], optional = true }
