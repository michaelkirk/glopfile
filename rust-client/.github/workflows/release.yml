name: release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - release
defaults:
  run:
    shell: bash
jobs:
  build-release:
    name: build-release
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      package_name: sendfile-cli
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu18, macos, windows]
        include:
          - platform: ubuntu18
            os:       ubuntu-18.04
            target:   x86_64-unknown-linux-gnu
            experimental: false

          - platform: macos
            os:       macos-latest
            target:   x86_64-apple-darwin
            experimental: false

          - platform: windows
            os:       windows-2019
            target:   x86_64-pc-windows-msvc
            experimental: true
    steps:
      - name: checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: restore cargo-about from cache
        id:   restore-cargo-about
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cargo-about
          key:  ${{ runner.os }}-cargo-about-0.5.1

      - name: cargo install cargo-about
        if:   steps.restore-cargo-about.outputs.cache-hit != 'true'
        run:  cargo install cargo-about --verbose --version 0.5.1

      - name: generate Acknowledgements.md
        run: cargo about generate Acknowledgements.md.hbs -o Acknowledgements.md

      - name: set package_version
        run: |
          echo "package_version=$(cargo pkgid --package ${{ env.package_name }} | cut -d\# -f2 | cut -d: -f2)" >> "$GITHUB_ENV"

      - name: cargo build --profile distribution
        run:  |
          SENDFILE_API_ENDPOINT=${{ secrets.SENDFILE_API_ENDPOINT }} \
          SENDFILE_DOWNLOAD_ENDPOINT=${{ secrets.SENDFILE_DOWNLOAD_ENDPOINT }} \
          cargo build --profile distribution --verbose --target=${{ matrix.target }}

      - name: assemble archive
        run: |
          archive_name=${{ env.package_name }}-$package_version-${{ matrix.platform }}
          mkdir -p "$archive_name/"
          cp README.md Acknowledgements.md "$archive_name/"
          if [ "${{ matrix.os }}" = "windows-2019" ]; then
            cp "target/${{ matrix.target }}/distribution/${{ env.package_name }}.exe" "$archive_name/"
            archive_filename="$archive_name.zip"
            7z a "$archive_filename" "$archive_name/"
          else
            cp "target/${{ matrix.target }}/distribution/${{ env.package_name }}" "$archive_name/"
            archive_filename="$archive_name.tar.gz"
            tar -czf "$archive_filename" "$archive_name/"
          fi
          echo "archive_filename=$archive_filename" >> "$GITHUB_ENV"

      - name: upload artifacts
        uses: actions/upload-artifact@v1
        with:
          name: ${{ env.archive_filename }}
          path: ${{ env.archive_filename }}

      - name: upload release archive
        run: |
          gh release create "${{ env.package_version }}" || true
          gh release upload --clobber "${{ env.package_version }}" "${{ env.archive_filename }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
